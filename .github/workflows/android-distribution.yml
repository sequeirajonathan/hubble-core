name: Android distribution (Play Internal)

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/android-distribution.yml"]
  workflow_dispatch:

concurrency:
  group: android-distribution
  cancel-in-progress: false

jobs:
  internal-track:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      FASTLANE_SKIP_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: app
      - run: flutter pub get
      - name: Materialize signing files
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload.keystore
          cat > android/key.properties <<KEYS
          storeFile=../upload.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          KEYS
          echo "$PLAY_STORE_JSON_KEY" > fastlane/play-store-key.json
      - name: Build + upload to Play Internal track
        run: bundle exec fastlane android internal build_number:${{ github.run_number }}

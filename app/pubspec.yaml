name: hubble
description: "Hubble: one app, every local storefront."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  go_router: ^18.0.1
  google_fonts: ^8.2.1
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.17.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# `dart run flutter_launcher_icons` after `tool/render_icon.sh` produces the PNG.
flutter_launcher_icons:
  image_path: assets/icon/hubble_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#1A1A1A"
  adaptive_icon_background: "#1A1A1A"
  adaptive_icon_foreground: assets/icon/hubble_icon.png
